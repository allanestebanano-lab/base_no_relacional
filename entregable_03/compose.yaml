name: nosql-entregable-03

services:
  keyfile-init:
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /keyfile/mongodb-keyfile ]; then
          umask 077
          head -c 756 /dev/urandom | base64 | tr -d '\n' > /keyfile/mongodb-keyfile
        fi
        chown 999:999 /keyfile/mongodb-keyfile
        chmod 400 /keyfile/mongodb-keyfile
    volumes:
      - mongo_keyfile:/keyfile

  mongodb:
    image: mongo:8.0.32-noble
    restart: unless-stopped
    depends_on:
      keyfile-init:
        condition: service_completed_successfully
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/run/mongo-key/mongodb-keyfile", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/run/mongo-key:ro

volumes:
  mongo_data:
    name: nosql-entregable-03_mongo_data
  mongo_keyfile:
    name: nosql-entregable-03_keyfile
