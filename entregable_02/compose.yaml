name: nosql-entregable-02

services:
  mongo-express:
    image: mongo-express:1.0.2-20

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USERNAME:?Falta usuario}:${MONGO_ROOT_PASSWORD:?Falta password}@mongodb:27017/?authSource=admin"

      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_WEB_USERNAME:?Falta usuario web}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_WEB_PASSWORD:?Falta password web}

    networks:
      - red_mongodb_compartida

networks:
  red_mongodb_compartida:
    external: true
    name: nosql-entregable-01_red_nosql