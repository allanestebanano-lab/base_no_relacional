# Snapshot RDB: snapshot adicional ante ciertos cambios; se puede forzar con BGSAVE.
save 3600 1 300 100 60 10000
dbfilename dump.rdb

# AOF: registra escrituras; fsync cada segundo como equilibrio para el laboratorio.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
appenddirname appendonlydir

dir /data
loglevel notice
